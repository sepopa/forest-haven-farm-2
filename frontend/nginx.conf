server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (e.g. /menu, /orders) — without
    # this, refreshing on any page but "/" would 404 since those paths don't
    # exist as real files. Fall back to index.html and let React Router
    # take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is not
    # cached so a new deploy is picked up on next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
